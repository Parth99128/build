providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.10"

[phases.setup]
nixPkgs = ["python310", "gcc", "stdenv.cc.cc.lib", "zlib"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install -r backend/requirements.txt"
]

[start]
cmd = "/opt/venv/bin/python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
